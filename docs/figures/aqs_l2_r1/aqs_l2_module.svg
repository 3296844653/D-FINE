<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="1100" viewBox="0 0 1980 1100" role="img" aria-labelledby="title desc">
<title id="title">AQS-L2 internal structure</title><desc id="desc">Max sigmoid score, learned threshold, hard forward gate with STE gradient, gated query mean, LayerNorm/MLP fusion, tanh residual scale and gated query addition. All 300 queries are retained.</desc>
<defs>
<marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker>
<marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#4274A7"/></marker>
<marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#B85A1D"/></marker>
</defs>
<rect width="1980" height="1100" fill="white"/>
<g font-family="Arial, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif">
<polyline id="score_importance" points="260,237.5 315,237.5" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow0)"/>
<polyline id="importance_gate" points="520,237.5 570,237.54" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow0)"/>
<polyline id="threshold_gate" points="535,420 551,420 551,324 570,323.925" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<polyline id="query_norm" points="245,692.5 300,692.5" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow0)"/>
<polyline id="query_pool" points="245,692.5 273,692.5 273,570 795,570 795,467.5 855,467.5" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow0)"/>
<polyline id="gate_pool" points="697.5,360 697.5,378 1070,378 1070,390" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<polyline id="gate_multiply" points="825,262.5 1660,262.5 1660,585 1554.9,585 1554.9,625" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<polyline id="pool_concat" points="1070,545 1070,595 957.5,595 957.5,635" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<polyline id="norm_concat" points="465,692.5 855,692.5" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow0)"/>
<polyline id="concat_mlp" points="1060,692.5 1115,692.5" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow0)"/>
<polyline id="mlp_multiply" points="1345,692.5 1410,692.5" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<polyline id="scale_multiply" points="1468.8,535 1468.8,625" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<polyline id="multiply_add" points="1620,692.5 1680,692.5" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<polyline id="add_out" points="1745,692.5 1790,692.5" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<polyline id="query_skip" points="152.5,750 152.5,827 1712.5,827 1712.5,725" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow0)"/>
<polyline id="out_l3" points="1870,750 1870,895" fill="none" stroke="#B85A1D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<text x="60" y="60" dominant-baseline="central" text-anchor="start" font-size="31" font-weight="700" fill="#23354B">AQS-L2：自适应query门控与上下文残差增强</text>
<text x="60" y="113" dominant-baseline="central" text-anchor="start" font-size="19" font-weight="400" fill="#52647A">展示普通检测query的计算；与当前 AdaptiveQuerySelectionRefiner 实现一致</text>
<rect x="60" y="175" width="200" height="125" rx="8" fill="#EDF4FA" stroke="#4274A7" stroke-width="2"/>
<text x="160" y="210.5" dominant-baseline="central" text-anchor="middle" font-size="21" font-weight="700" fill="#23354B">L2类别logits S₂</text>
<text x="160" y="239.75" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">ClsHead₂ + LQE₂</text>
<text x="160" y="266.75" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">300 × 3</text>
<rect x="315" y="175" width="205" height="125" rx="8" fill="#EDF4FA" stroke="#4274A7" stroke-width="2"/>
<text x="417.5" y="224.75" dominant-baseline="central" text-anchor="middle" font-size="22" font-weight="700" fill="#23354B">置信度重要性</text>
<text x="417.5" y="254" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">sᵢ = max_c sigmoid(Sᵢc)</text>
<rect x="570" y="165" width="255" height="195" rx="8" fill="#FFF1E3" stroke="#B85A1D" stroke-width="2"/>
<text x="697.5" y="211.5" dominant-baseline="central" text-anchor="middle" font-size="24" font-weight="700" fill="#23354B">硬门控 + STE</text>
<text x="697.5" y="242.25" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">g_h = 1[sᵢ ≥ τ]</text>
<text x="697.5" y="267.75" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">g_s = sigmoid((sᵢ − τ)/T)</text>
<text x="697.5" y="293.25" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">前向：硬选择；反向：软梯度</text>
<text x="697.5" y="318.75" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">T = 0.10（固定）</text>
<rect x="315" y="365" width="220" height="110" rx="8" fill="#FFF1E3" stroke="#B85A1D" stroke-width="2"/>
<text x="425" y="393" dominant-baseline="central" text-anchor="middle" font-size="22" font-weight="700" fill="#23354B">可学习阈值 τ</text>
<text x="425" y="423" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">τ = sigmoid(θ)</text>
<text x="425" y="450" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">τ₀ = 0.50</text>
<rect x="60" y="635" width="185" height="115" rx="8" fill="#EDF4FA" stroke="#4274A7" stroke-width="2"/>
<text x="152.5" y="665.5" dominant-baseline="central" text-anchor="middle" font-size="23" font-weight="700" fill="#23354B">L2 query Q₂</text>
<text x="152.5" y="696.25" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">300 × 256</text>
<text x="152.5" y="723.25" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">保留全部query</text>
<rect x="300" y="635" width="165" height="115" rx="8" fill="#EDF4FA" stroke="#4274A7" stroke-width="2"/>
<text x="382.5" y="679" dominant-baseline="central" text-anchor="middle" font-size="22" font-weight="700" fill="#23354B">LayerNorm</text>
<text x="382.5" y="709" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">LN(qᵢ)</text>
<rect x="855" y="390" width="430" height="155" rx="8" fill="#FFF1E3" stroke="#B85A1D" stroke-width="2"/>
<text x="1070" y="437.5" dominant-baseline="central" text-anchor="middle" font-size="23" font-weight="700" fill="#23354B">选中query的上下文池化</text>
<text x="1070" y="469.75" dominant-baseline="central" text-anchor="middle" font-size="20" font-weight="400" fill="#52647A">c = Σᵢ gᵢqᵢ / max(Σᵢ gᵢ, 1)</text>
<text x="1070" y="499.75" dominant-baseline="central" text-anchor="middle" font-size="20" font-weight="400" fill="#52647A">将c广播至所有query位置</text>
<rect x="855" y="635" width="205" height="115" rx="8" fill="#EDF4FA" stroke="#4274A7" stroke-width="2"/>
<text x="957.5" y="665.5" dominant-baseline="central" text-anchor="middle" font-size="23" font-weight="700" fill="#23354B">拼接</text>
<text x="957.5" y="696.25" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">[ LN(qᵢ) ; c ]</text>
<text x="957.5" y="723.25" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">256 + 256 → 512</text>
<rect x="1115" y="635" width="230" height="115" rx="8" fill="#EDF4FA" stroke="#4274A7" stroke-width="2"/>
<text x="1230" y="667" dominant-baseline="central" text-anchor="middle" font-size="23" font-weight="700" fill="#23354B">融合MLP</text>
<text x="1230" y="697" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">Linear → SiLU → Linear</text>
<text x="1230" y="722.5" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">512 → 256 → 256</text>
<rect x="1410" y="420" width="210" height="115" rx="8" fill="#FFF1E3" stroke="#B85A1D" stroke-width="2"/>
<text x="1515" y="450.5" dominant-baseline="central" text-anchor="middle" font-size="22" font-weight="700" fill="#23354B">可学习残差缩放</text>
<text x="1515" y="480.5" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">β = tanh(ρ)</text>
<text x="1515" y="507.5" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">ρ₀ = 0.10</text>
<rect x="1410" y="625" width="210" height="135" rx="8" fill="#FFF1E3" stroke="#B85A1D" stroke-width="2"/>
<text x="1515" y="667" dominant-baseline="central" text-anchor="middle" font-size="24" font-weight="700" fill="#23354B">门控残差</text>
<text x="1515" y="697.75" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">β · gᵢ · Δqᵢ</text>
<text x="1515" y="723.25" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">Δqᵢ = MLP([LN(qᵢ); c])</text>
<ellipse cx="1712.5" cy="692.5" rx="32.5" ry="32.5" fill="#FFFFFF" stroke="#B85A1D" stroke-width="2"/>
<text x="1712.5" y="692.5" dominant-baseline="central" text-anchor="middle" font-size="35" font-weight="700" fill="#23354B">+</text>
<rect x="1790" y="635" width="160" height="115" rx="8" fill="#FFF1E3" stroke="#B85A1D" stroke-width="2"/>
<text x="1870" y="679" dominant-baseline="central" text-anchor="middle" font-size="21" font-weight="700" fill="#23354B">增强query Q₂′</text>
<text x="1870" y="708.25" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">300 × 256</text>
<rect x="1790" y="895" width="160" height="100" rx="8" fill="#EDF4FA" stroke="#4274A7" stroke-width="2"/>
<text x="1870" y="932.25" dominant-baseline="central" text-anchor="middle" font-size="21" font-weight="700" fill="#23354B">Decoder L3</text>
<text x="1870" y="960.75" dominant-baseline="central" text-anchor="middle" font-size="17" font-weight="400" fill="#52647A">继续分类与定位</text>
<text x="1210" y="235" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#B85A1D">门控g：选择池化query，同时控制残差写入</text>
<text x="650" y="666" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">每个query的归一化特征</text>
<text x="1020" y="850" dominant-baseline="central" text-anchor="middle" font-size="18" font-weight="400" fill="#52647A">恒等路径：gᵢ = 0时，原query保持不变；不是删除query</text>
<text x="60" y="928.5" dominant-baseline="central" text-anchor="start" font-size="25" font-weight="700" fill="#23354B">qᵢ′ = qᵢ + tanh(ρ) · gᵢ · MLP([LN(qᵢ); c])</text>
<text x="60" y="979" dominant-baseline="central" text-anchor="start" font-size="18" font-weight="400" fill="#52647A">STE：g = stopgrad(g_h − g_s) + g_s；MLP最后一层零初始化，使初始残差为0。</text>
<text x="60" y="1026" dominant-baseline="central" text-anchor="start" font-size="18" font-weight="400" fill="#52647A">训练时DN与普通query分别计算，不相互池化；AQS不直接输入或修改bbox，L3可受query更新间接影响。</text>
</g>
</svg>
