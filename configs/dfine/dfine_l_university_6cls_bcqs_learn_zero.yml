# BCQS zero-start learnable-weight experiment.
# Initial BCQS contribution is exactly zero; training learns whether to use the branch.

__include__:
  - dfine_l_university_6cls.yml

output_dir: ./output/dfine_l_university_6cls_bcqs_learn_zero

DFINETransformer:
  use_bcqs: True
  bcqs_kernel_size: 3
  # Ignored by zero-start mode; kept for readable comparison with other BCQS configs.
  bcqs_score_weight: 0.25
  bcqs_learn_score_weight: zero
