__include__:
  - dfine_m_university_5cls_132.yml

# Exp-1: final-layer Hungarian-matched query supervised contrastive loss.
# The baseline VFL, matcher, regression and inference graph are unchanged.
DFINETransformer:
  return_query_features: true

DFINECriterion:
  use_supcon: true
  supcon_loss_weight: 0.05
  supcon_temperature: 0.10
