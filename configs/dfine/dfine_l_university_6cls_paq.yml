# Config path: configs/dfine/dfine_l_university_6cls_paq.yml

__include__:
  - dfine_l_university_6cls.yml

output_dir: ./output/dfine_l_university_6cls_paq

DFINETransformer:
  # PaQ-RT-DETR dynamic query: top-k encoder features generate N x M
  # combination weights, then decoder content queries are formed from latent patterns.
  use_paq_query: True
  # Number of latent patterns M in PaQ.
  paq_num_patterns: 100

  # Keep BCQS disabled so this run measures PaQ dynamic query alone.
  use_bcqs: False
