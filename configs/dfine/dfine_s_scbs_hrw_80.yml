__include__:
  - dfine_hgnetv2_s_coco.yml

# Independent SCB-S / D-FINE-S baseline: 80 epochs, stop augmentation at 72.
# Original annotations: 0=hand-raising, 1=read, 2=write; no experiment modules.
num_classes: 3
remap_mscoco_category: False
epochs: 80
output_dir: ./output/dfine_s_scbs_hrw_80

train_dataloader:
  total_batch_size: 32
  num_workers: 4
  dataset:
    img_folder: /media/a5/5号机移动盘2/wq_datasets/SCB-S/images/train
    ann_file: /media/a5/5号机移动盘2/wq_datasets/SCB-S/annotations/instances_train.json
    transforms:
      policy:
        epoch: 72
  collate_fn:
    stop_epoch: 72

val_dataloader:
  total_batch_size: 32
  num_workers: 4
  dataset:
    img_folder: /media/a5/5号机移动盘2/wq_datasets/SCB-S/images/val
    ann_file: /media/a5/5号机移动盘2/wq_datasets/SCB-S/annotations/instances_val.json
