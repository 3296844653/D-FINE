__include__:
  - dfine_s_scbs_hrw_110_aqs_layer2_r010.yml

# ONE new Encoder mechanism on unchanged AQS-L2 R1. No loss changes.
# P2 subcells + FPN P3/P4 -> SubpixelContextFusion -> original PAN -> Decoder/AQS.
output_dir: ./output/dfine_s_scbs_hrw_epochs110_AQS_SubpixelContextFusion_seed0_run1

HGNetv2:
  return_idx: [0, 1, 2, 3]

train_dataloader:
  dataset:
    img_folder: /media/a5/5号机移动盘2/wq_datasets/SCB-S/images/train
    ann_file: /media/a5/5号机移动盘2/wq_datasets/SCB-S/annotations/instances_train.json

val_dataloader:
  dataset:
    img_folder: /media/a5/5号机移动盘2/wq_datasets/SCB-S/images/val
    ann_file: /media/a5/5号机移动盘2/wq_datasets/SCB-S/annotations/instances_val.json

HybridEncoder:
  use_subpixel_context_fusion: true
  scf_p2_channels: 64
  scf_dim: 32
  scf_dilation: 2
  scf_residual_init: 0.10
  scf_checkpoint: true
