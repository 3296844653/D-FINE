__include__:
  - dfine_s_scbs_hrw_110.yml

# Independent AQS-derived evidence transfer, L2 -> L3. No extra loss/module.
output_dir: ./output/dfine_s_scbs_hrw_epochs110_EvidenceContrastAQS_seed0_run1
DFINETransformer:
  use_aqs_refine: true
  aqs_refiner_type: EvidenceContrastAQS
  aqs_apply_layer: 2
  aqs_threshold: 0.50
  aqs_temperature: 0.10
  aqs_residual_init: 0.10
  aqs_evidence_dim: 64
  aqs_evidence_slots: 4
  aqs_evidence_heads: 4
