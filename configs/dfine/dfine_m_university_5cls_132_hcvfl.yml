# Hard-class-aware Varifocal Loss ablation for the five-class D-FINE-M baseline.
# Counts follow the training annotation category order:
# reading, writing, using_phone, bowing_head, leaning_over_table.

__include__:
  - dfine_m_university_5cls_132.yml

DFINECriterion:
  use_class_aware_vfl: true
  vfl_class_counts: [6216, 2365, 5506, 762, 807]
  vfl_class_weight_power: 0.25
  vfl_class_weight_max: 2.0
