__include__:
  - dfine_m_university_5cls_132.yml

DFINECriterion:
  losses: ['eqlv2_vfl', 'boxes', 'local']
  weight_dict:
    loss_eqlv2_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
  eqlv2_gamma: 12.0
  eqlv2_mu: 0.8
  eqlv2_alpha: 4.0
  # Update the dynamic gradient statistics once per iteration from the final
  # decoder output. Auxiliary, encoder and denoising heads use the same current
  # weights but do not repeatedly alter the statistics.
  eqlv2_update_main_only: true
